---
- name: Basic NFS write test
  hosts: localhost
  gather_facts: yes
  
  tasks:
    - name: Write timestamp to NFS
      copy:
        content: |
          Job ID: {{ tower_job_id | default('test') }}
          Time: {{ ansible_date_time.iso8601 }}
          Status: Test successful
        dest: "/var/log/awx-jobs/test_{{ tower_job_id | default('manual') }}.txt"

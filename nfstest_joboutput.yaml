---
- name: Capture and save full job output to NFS
  hosts: localhost
  gather_facts: yes
  
  vars:
    nfs_base_path: "/var/log/awx-jobs"
    job_id: "{{ tower_job_id | default('manual') }}"
    job_name: "{{ tower_job_template_name | default('unknown') }}"
    job_output_file: "{{ nfs_base_path }}/{{ job_name }}/job_{{ job_id }}_complete_output.txt"
  
  tasks:
    # ============================================
    # 1. Setup - Create directory
    # ============================================
    - name: Create job directory
      file:
        path: "{{ nfs_base_path }}/{{ job_name }}"
        state: directory
        mode: '0755'
        recurse: yes
    
    # ============================================
    # 2. Initialize output file
    # ============================================
    - name: Initialize job output
      copy:
        dest: "{{ job_output_file }}"
        content: |
          ========================================
          AWX JOB EXECUTION LOG
          ========================================
          Job ID: {{ job_id }}
          Job Name: {{ job_name }}
          User: {{ tower_user_name | default('admin') }}
          Start Time: {{ ansible_date_time.iso8601 }}
          ========================================
    
    # ============================================
    # 3. Add system information (simplified)
    # ============================================
    - name: Add system info to output
      lineinfile:
        path: "{{ job_output_file }}"
        line: |
          
          --- SYSTEM INFORMATION ---
          Hostname: {{ ansible_hostname }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Kernel: {{ ansible_kernel }}
          Architecture: {{ ansible_architecture }}
          CPU: {{ ansible_processor_cores }} cores
          Memory: {{ ansible_memtotal_mb }} MB
        insertafter: EOF
    
    # ============================================
    # 4. Execute your main tasks
    # ============================================
    - name: Execute main job tasks
      block:
        # ADD YOUR ACTUAL TASKS HERE
        - name: Example Task 1 - Check uptime
          command: uptime
          register: uptime_output
        
        - name: Add uptime to output
          lineinfile:
            path: "{{ job_output_file }}"
            line: |
              
              --- TASK: System Uptime ---
              {{ uptime_output.stdout }}
            insertafter: EOF
        
        - name: Example Task 2 - Check disk space
          command: df -h
          register: df_output
        
        - name: Add disk info to output
          lineinfile:
            path: "{{ job_output_file }}"
            line: |
              
              --- TASK: Disk Usage ---
              {{ df_output.stdout }}
            insertafter: EOF
        
        # YOUR CUSTOM TASKS GO HERE
        - name: Your custom task
          debug:
            msg: "Executing custom job logic"
          register: custom_output
        
        - name: Add custom task output
          lineinfile:
            path: "{{ job_output_file }}"
            line: |
              
              --- TASK: Custom Job Logic ---
              {{ custom_output.msg }}
            insertafter: EOF
        
        - name: Set success status
          set_fact:
            job_status: "SUCCESS"
      
      rescue:
        - name: Set failure status
          set_fact:
            job_status: "FAILED"
            error_msg: "{{ ansible_failed_result.msg | default('Unknown error') }}"
        
        - name: Add error to output
          lineinfile:
            path: "{{ job_output_file }}"
            line: |
              
              --- JOB FAILED ---
              Error: {{ error_msg }}
            insertafter: EOF
    
    # ============================================
    # 5. Finalize output
    # ============================================
    - name: Finalize job output
      lineinfile:
        path: "{{ job_output_file }}"
        line: |
          
          ========================================
          JOB COMPLETED
          ========================================
          Status: {{ job_status | default('SUCCESS') }}
          End Time: {{ ansible_date_time.iso8601 }}
          ========================================
        insertafter: EOF
    
    # ============================================
    # 6. Create summary file
    # ============================================
    - name: Create JSON summary
      copy:
        dest: "{{ nfs_base_path }}/{{ job_name }}/job_{{ job_id }}_summary.json"
        content: |
          {
            "job_id": "{{ job_id }}",
            "job_name": "{{ job_name }}",
            "status": "{{ job_status | default('SUCCESS') }}",
            "start_time": "{{ ansible_date_time.iso8601 }}",
            "user": "{{ tower_user_name | default('admin') }}",
            "output_file": "job_{{ job_id }}_complete_output.txt"
          }
    
    - name: Create latest symlink
      file:
        src: "{{ job_output_file }}"
        dest: "{{ nfs_base_path }}/{{ job_name }}/latest.txt"
        state: link
        force: yes

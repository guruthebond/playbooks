---
- name: Single aggregated log
  hosts: all
  gather_facts: no

  tasks:

    - name: Run command
      shell: hostname
      register: result

    - name: Store result per host
      set_fact:
        host_output: "{{ result.stdout }}"

    - name: Write combined log
      copy:
        content: |
          {% for h in ansible_play_hosts %}
          {{ h }}: {{ hostvars[h].host_output }}
          {% endfor %}
        dest: "/mnt/awx-logs/job-{{ tower_job_id }}.log"
      delegate_to: 10.1.0.80
      run_once: true

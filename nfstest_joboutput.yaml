---
- name: Capture and send logs to NFS
  hosts: all
  gather_facts: no

  tasks:

    - name: Run command
      shell: hostname
      register: result

    - name: Write per-host output to NFS
      copy:
        content: |
          =========================
          AWX JOB OUTPUT
          Job ID: {{ tower_job_id }}
          Host: {{ inventory_hostname }}
          Output: {{ result.stdout }}
          =========================
        dest: "/mnt/awx-logs/job-{{ tower_job_id }}-{{ inventory_hostname }}.log"
      delegate_to: 10.1.0.80

---
- name: Capture and store job output to NFS
  hosts: all
  gather_facts: no

  tasks:

    - name: Run command
      shell: hostname
      register: result

    - name: Write output directly to NFS (no aggregation)
      copy:
        content: |
          AWX JOB OUTPUT
          Job ID: {{ tower_job_id }}
          Host: {{ inventory_hostname }}
          Output: {{ result.stdout }}
        dest: "/mnt/awx-logs/job-{{ tower_job_id }}-{{ inventory_hostname }}.log"
      delegate_to: 10.1.0.80

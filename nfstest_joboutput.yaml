---
- name: Capture and save job output to NFS
  hosts: localhost
  gather_facts: yes
  
  vars:
    nfs_base_path: "/var/log/awx-jobs"
    job_id: "{{ tower_job_id | default('manual') }}"
    job_name: "{{ tower_job_template_name | default('job') }}"
    job_output_file: "{{ nfs_base_path }}/{{ job_name }}/job_{{ job_id }}_complete_output.txt"
  
  tasks:
    # ============================================
    # 1. Setup - Create directory
    # ============================================
    - name: Create job directory
      file:
        path: "{{ nfs_base_path }}/{{ job_name }}"
        state: directory
        mode: '0755'
        recurse: yes
    
    # ============================================
    # 2. Initialize output file
    # ============================================
    - name: Initialize job output
      copy:
        dest: "{{ job_output_file }}"
        content: |
          ========================================
          AWX JOB EXECUTION LOG
          ========================================
          Job ID: {{ job_id }}
          Job Name: {{ job_name }}
          User: {{ tower_user_name | default('admin') }}
          Start Time: {{ ansible_date_time.iso8601 }}
          ========================================
    
    # ============================================
    # 3. Add environment info (works in EE)
    # ============================================
    - name: Add environment info
      lineinfile:
        path: "{{ job_output_file }}"
        line: |
          
          --- ENVIRONMENT INFORMATION ---
          Hostname: {{ ansible_hostname }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Python Version: {{ ansible_python_version }}
          Ansible Version: {{ ansible_version.full }}
          AWX Job ID: {{ job_id }}
        insertafter: EOF
    
    # ============================================
    # 4. Execute your main tasks using shell commands
    # ============================================
    - name: Execute job tasks
      block:
        # Use shell commands that work in EE container
        - name: Task 1 - Get current date and time
          shell: |
            echo "Current date and time"
            date
            echo "Timezone: $(cat /etc/timezone 2>/dev/null || echo 'UTC')"
          register: datetime_output
          ignore_errors: yes
        
        - name: Add datetime info
          lineinfile:
            path: "{{ job_output_file }}"
            line: |
              
              --- TASK 1: Date and Time ---
              {{ datetime_output.stdout }}
            insertafter: EOF
        
        - name: Task 2 - Check Python version
          command: python3 --version
          register: python_version
          ignore_errors: yes
        
        - name: Add Python info
          lineinfile:
            path: "{{ job_output_file }}"
            line: |
              
              --- TASK 2: Python Version ---
              {{ python_version.stdout | default('Python version check failed') }}
            insertafter: EOF
        
        - name: Task 3 - Check disk space in /tmp
          shell: df -h /tmp
          register: disk_space
          ignore_errors: yes
        
        - name: Add disk info
          lineinfile:
            path: "{{ job_output_file }}"
            line: |
              
              --- TASK 3: Disk Space (/tmp) ---
              {{ disk_space.stdout }}
            insertafter: EOF
        
        - name: Task 4 - List files in current directory
          shell: ls -la /runner/project/
          register: file_list
          ignore_errors: yes
        
        - name: Add file listing
          lineinfile:
            path: "{{ job_output_file }}"
            line: |
              
              --- TASK 4: Project Files ---
              {{ file_list.stdout }}
            insertafter: EOF
        
        # ========================================
        # ADD YOUR CUSTOM TASKS HERE
        # ========================================
        - name: Your custom application logic
          debug:
            msg: "Executing custom job logic for job {{ job_id }}"
          register: custom_output
        
        - name: Add custom output
          lineinfile:
            path: "{{ job_output_file }}"
            line: |
              
              --- CUSTOM TASK: Application Logic ---
              {{ custom_output.msg }}
            insertafter: EOF
        
        - name: Set success status
          set_fact:
            job_status: "SUCCESS"
      
      rescue:
        - name: Set failure status
          set_fact:
            job_status: "FAILED"
            error_msg: "{{ ansible_failed_result.msg | default('Unknown error') }}"
        
        - name: Add error to output
          lineinfile:
            path: "{{ job_output_file }}"
            line: |
              
              --- JOB FAILED ---
              Error: {{ error_msg }}
              Failed Task: {{ ansible_failed_task.name | default('Unknown') }}
            insertafter: EOF
    
    # ============================================
    # 5. Finalize output
    # ============================================
    - name: Finalize job output
      lineinfile:
        path: "{{ job_output_file }}"
        line: |
          
          ========================================
          JOB COMPLETED
          ========================================
          Status: {{ job_status | default('SUCCESS') }}
          End Time: {{ ansible_date_time.iso8601 }}
          ========================================
        insertafter: EOF
    
    # ============================================
    # 6. Create summary files
    # ============================================
    - name: Create JSON summary
      copy:
        dest: "{{ nfs_base_path }}/{{ job_name }}/job_{{ job_id }}_summary.json"
        content: |
          {
            "job_id": "{{ job_id }}",
            "job_name": "{{ job_name }}",
            "status": "{{ job_status | default('SUCCESS') }}",
            "start_time": "{{ ansible_date_time.iso8601 }}",
            "user": "{{ tower_user_name | default('admin') }}",
            "output_file": "job_{{ job_id }}_complete_output.txt"
          }
    
    - name: Create latest symlink
      file:
        src: "{{ job_output_file }}"
        dest: "{{ nfs_base_path }}/{{ job_name }}/latest.txt"
        state: link
        force: yes
    
    # ============================================
    # 7. Display summary
    # ============================================
    - name: Show job completion summary
      debug:
        msg: |
          
          ========================================
          JOB {{ job_id }} COMPLETED
          ========================================
          Status: {{ job_status | default('SUCCESS') }}
          Output: {{ job_output_file }}
          Summary: {{ nfs_base_path }}/{{ job_name }}/job_{{ job_id }}_summary.json
          ========================================

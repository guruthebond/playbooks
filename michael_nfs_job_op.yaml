---
- name: "Write job output directly to NFS using delegate host"
  hosts: all
  gather_facts: false

  vars:
    nfs_delegate_host: "63.136.253.17"
    nfs_base_path: "/nfs/novashare"
    job_output_sub_path: "job-output"
    job_output_dir: "{{ nfs_base_path }}/{{ job_output_sub_path }}"
    job_id: "{{ tower_job_id | default(awx_job_id) | default('manual') }}"

  tasks:
    - name: "Run command on inventory host"
      ansible.builtin.command: hostname
      register: result
      changed_when: false

    - name: "Ensure output directory exists on NFS delegate host"
      ansible.builtin.file:
        path: "{{ job_output_dir }}"
        state: directory
        mode: "0755"
      delegate_to: "{{ nfs_delegate_host }}"

    - name: "Write output to NFS on delegate host"
      ansible.builtin.copy:
        content: |
          =========================
          AWX JOB OUTPUT
          Job ID: {{ job_id }}
          Inventory Host: {{ inventory_hostname }}
          Hostname Output: {{ result.stdout }}
          Delegate Host: {{ nfs_delegate_host }}
          Output Directory: {{ job_output_dir }}
          =========================
        dest: "{{ job_output_dir }}/job-{{ job_id }}-{{ inventory_hostname }}.log"
        mode: "0644"
      delegate_to: "{{ nfs_delegate_host }}"

    - name: "Display resolved output path"
      ansible.builtin.debug:
        msg: "Wrote job output to {{ job_output_dir }}/job-{{ job_id }}-{{ inventory_hostname }}.log via {{ nfs_delegate_host }}"

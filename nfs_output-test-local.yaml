---
- name: "Write AWX job output to delegated NFS server"
  hosts: all
  gather_facts: false

  vars:
    nfs_server: "63.136.253.17"
    nfs_path: "/nfs/novashare"
    job_id: "{{ tower_job_id | default(awx_job_id) | default('manual') }}"
    output_file: "{{ nfs_path }}/job-{{ job_id }}-{{ inventory_hostname }}.log"

  tasks:
    - name: "Run hostname command on inventory host"
      command: hostname
      register: result

    - name: "Write per-host output to NFS server"
      copy:
        content: |
          =========================
          AWX JOB OUTPUT
          Job ID: {{ job_id }}
          Inventory Host: {{ inventory_hostname }}
          Hostname Output: {{ result.stdout }}
          =========================
        dest: "{{ output_file }}"
        mode: "0644"
      delegate_to: "{{ nfs_server }}"

    - name: "Validate file exists on NFS server"
      stat:
        path: "{{ output_file }}"
      register: output_file_stat
      delegate_to: "{{ nfs_server }}"

    - name: "Show written file status"
      debug:
        msg: "File {{ output_file }} exists on {{ nfs_server }}: {{ output_file_stat.stat.exists }}"

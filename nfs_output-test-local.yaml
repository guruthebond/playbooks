---
- name: "Write job output to NFS server using delegate"
  hosts: all
  gather_facts: falsex_job_id) | default('manual') }}"  gather_facts: false

  tasks:
    - name: "Run command on target host"
      command: hostname
      register: result

    - name: "Write per-host output to NFS server"
      copy:
        content: |
          =========================
          AWX JOB OUTPUT
          Job ID: {{ job_id }}
          Target Host: {{ inventory_hostname }}
          Command Output: {{ result.stdout }}
          =========================
        dest: "/nfs/novashare/job-{{ job_id }}-{{ inventory_hostname }}.log"
        mode: "0644"
      delegate_to: "63.136.253.17"

  vars:

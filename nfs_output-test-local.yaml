---
- name: Write job_facts: false- name: Write job output directly to NFS server

  tasks:
    - name: Run command on inventory host
      shell: hostname
      register: result

    - name: Write per-host output to NFS server
      copy:
        content: |
          =========================
          AWX JOB OUTPUT
          Job ID: {{ tower_job_id }}
          Host: {{ inventory_hostname }}
          Output: {{ result.stdout }}
          =========================
        dest: "/nfs/novashare/job-{{ tower_job_id }}-{{ inventory_hostname }}.log"
        mode: "0644"
      delegate_to: 63.136.253.17
  hosts: all

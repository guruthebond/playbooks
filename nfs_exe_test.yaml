---
- name: Test NFS from execution node
  hosts: all
  gather_facts: no

  tasks:

    - name: Show execution node
      command: hostname
      delegate_to: localhost
      run_once: true
      register: exec_node

    - debug:
        msg: "Execution node is {{ exec_node.stdout }}"

    - name: Write file from execution node
      copy:
        content: |
          Written from execution node
          Exec node: {{ exec_node.stdout }}
          Time: {{ lookup('pipe', 'date') }}
        dest: "/mnt/awx-logs/awx-test.txt"
      delegate_to: localhost
      run_once: true

    - name: Verify file exists
      command: cat /mnt/awx-logs/awx-test.txt
      delegate_to: localhost
      run_once: true
      register: out

    - debug:
        var: out.stdout

---
- name: Test NFS from execution node
  hosts: all
  gather_facts: yes

  tasks:

    - name: Show execution node
      debug:
        msg: "Execution node is {{ ansible_hostname }}"
      delegate_to: localhost
      run_once: true

    - name: Write file from execution node
      copy:
        content: |
          Written from execution node
          Exec node: {{ ansible_hostname }}
          Time: {{ ansible_date_time.iso8601 }}
        dest: "/mnt/awx-logs/awx-test.txt"
      delegate_to: localhost
      run_once: true

    - name: Read file back
      slurp:
        src: "/mnt/awx-logs/awx-test.txt"
      delegate_to: localhost
      run_once: true
      register: file_content

    - debug:
        msg: "{{ file_content.content | b64decode }}"

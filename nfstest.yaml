---
- name: Test NFS mount in EE pod
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Check if /var/log/awx-jobs exists
      command: ls -la /var/log/awx-jobs/
      register: dir_check
      failed_when: false
      changed_when: false
    
    - name: Show directory status
      debug:
        msg: "Directory exists: {{ dir_check.rc == 0 }}"
    
    - name: Try to create test file
      shell: |
        mkdir -p /var/log/awx-jobs/ee-test
        echo "EE pod test at $(date)" > /var/log/awx-jobs/ee-test/test.txt
        echo "Pod name: $HOSTNAME" >> /var/log/awx-jobs/ee-test/test.txt
        cat /var/log/awx-jobs/ee-test/test.txt
      args:
        executable: /bin/bash
      register: write_test
      when: dir_check.rc == 0
    
    - name: Show result
      debug:
        msg: "{{ write_test.stdout_lines }}"
      when: write_test is defined

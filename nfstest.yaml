---
- name: Find writable location
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Check who we are
      command: id
      register: user_id
      changed_when: false
    
    - name: Show user info
      debug:
        msg: "{{ user_id.stdout }}"
    
    - name: List /var/log
      command: ls -la /var/log/
      register: var_log
      changed_when: false
    
    - name: Show /var/log
      debug:
        msg: "{{ var_log.stdout_lines }}"
    
    - name: Try writing to /tmp first
      copy:
        content: "Test from AWX job at {{ ansible_date_time.iso8601 }}"
        dest: /tmp/test-from-awx.txt
    
    - name: Try writing to /var/log/awx-jobs
      copy:
        content: "Test to awx-jobs"
        dest: /var/log/awx-jobs/test.txt
      ignore_errors: yes
      register: test_write
    
    - name: Check if write succeeded
      debug:
        msg: "Write to /var/log/awx-jobs {{ 'succeeded' if test_write is not failed else 'failed' }}"

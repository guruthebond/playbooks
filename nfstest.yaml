---
- name: Long running test for debugging
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Debug - show pod info
      debug:
        msg: "Starting debug job on {{ ansible_date_time.iso8601 }}"
    
    - name: Wait for manual inspection
      pause:
        minutes: 2
    
    - name: Try to create NFS directory
      shell: |
        mkdir -p /var/log/awx-jobs
        echo "Test from EE worker at $(date)" > /var/log/awx-jobs/worker-test.txt
        cat /var/log/awx-jobs/worker-test.txt
      args:
        executable: /bin/bash
      register: result
    
    - name: Show result
      debug:
        msg: "{{ result.stdout_lines }}"

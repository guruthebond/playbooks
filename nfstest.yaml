---
- name: Test write to AWX NFS mount
  hosts: localhost
  gather_facts: false

  vars:
    output_dir: "/var/log/awx-jobs/custom"

  tasks:
    - name: Ensure custom directory exists
      file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0775'

    - name: Write test file to NFS
      copy:
        dest: "{{ output_dir }}/job_{{ tower_job_id | default('manual') }}.txt"
        content: |
          ===== AWX NFS TEST =====
          Job ID: {{ tower_job_id | default('N/A') }}
          Template: {{ tower_job_template_name | default('N/A') }}
          User: {{ tower_user_name | default('N/A') }}
          Time: {{ lookup('pipe', 'date') }}
          Host: {{ inventory_hostname }}

    - name: Verify file exists
      stat:
        path: "{{ output_dir }}/job_{{ tower_job_id | default('manual') }}.txt"
      register: file_check

    - name: Show result
      debug:
        msg: "File created successfully at {{ output_dir }}"
      when: file_check.stat.exists

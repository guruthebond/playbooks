---
- name: Long running test for debugging
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Debug - show start time
      command: date
      register: start_time
    
    - name: Show start time
      debug:
        msg: "Starting debug job at {{ start_time.stdout }}"
    
    - name: Wait for manual inspection (60 seconds)
      pause:
        seconds: 60
    
    - name: Try to create NFS directory
      shell: |
        mkdir -p /var/log/awx-jobs
        echo "Test from EE worker at $(date)" > /var/log/awx-jobs/worker-test.txt
        cat /var/log/awx-jobs/worker-test.txt
      args:
        executable: /bin/bash
      register: result
    
    - name: Show result
      debug:
        msg: "{{ result.stdout_lines }}"

---
- name: Simple NFS write test
  hosts: localhost
  gather_facts: false
  
  tasks:
    - name: Write test file using shell
      shell: |
        mkdir -p /var/log/awx-jobs/custom
        echo "Test from AWX at $(date)" > /var/log/awx-jobs/custom/test.txt
        echo "Job ID: {{ tower_job_id | default('N/A') }}" >> /var/log/awx-jobs/custom/test.txt
        echo "User: $(whoami)" >> /var/log/awx-jobs/custom/test.txt
        echo "UID: $(id -u)" >> /var/log/awx-jobs/custom/test.txt
        echo "Success!" >> /var/log/awx-jobs/custom/test.txt
        cat /var/log/awx-jobs/custom/test.txt
      args:
        executable: /bin/bash
      register: result

    - name: Show output
      debug:
        msg: "{{ result.stdout_lines }}"

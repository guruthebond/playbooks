---
- name: Check Kubernetes certificate expiry and send email
  hosts: all
  run_once: true
  become: true
  become_method: sudo
  become_user: root
  gather_facts: false

  vars:
    expiry_threshold_days: 300

    # SMTP settings (MATCHES your working AWX UI test)
    smtp_server: "mailgate.corp.intranet"
    smtp_port: 25
    smtp_timeout: 10

    email_to: "gurdyal.singh@lumen.com"
    email_from: "no-reply-awx-qa@lumen.com"

  tasks:

    - name: Run kubeadm certs check-expiration
      command: kubeadm certs check-expiration
      register: cert_output
      changed_when: false

    - name: DEBUG | Raw kubeadm output
      debug:
        var: cert_output.stdout_lines

    - name: Initialize certificate list
      set_fact:
        expiring_certs: []

    - name: Extract certificate name and remaining days
      set_fact:
        expiring_certs: "{{ expiring_certs + [ {
          'name': fields[0],
          'days_left': (fields[3] | regex_replace('d','') | int)
        } ] }}"
      vars:
        fields: "{{ item.split() }}"
      loop: "{{ cert_output.stdout_lines }}"
      when:
        - item | regex_search('^[a-zA-Z]')
        - item is not search('CERTIFICATE')
        - item.split() | length >= 4

    - name: DEBUG | All parsed certificates
      debug:
        var: expiring_certs

    - name: Filter certificates below expiry threshold
      set_fact:
        alert_list: "{{ expiring_certs | selectattr('days_left', 'lt', expiry_threshold_days) | list }}"

    - name: DEBUG | Certificates below {{ expiry_threshold_days }} days
      debug:
        var: alert_list

    - name: DEBUG | Will email be sent?
      debug:
        msg: >-
          Email WILL be sent because {{ alert_list | length }}
          certificate(s) are below threshold.
      when: alert_list | length > 0

    - name: DEBUG | Why email is NOT being sent
      debug:
        msg: >-
          Email NOT sent because no certificates are below
          {{ expiry_threshold_days }} days.
      when: alert_list | length == 0

    - name: Send email alert if certificates are expiring
      community.general.mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port }}"
        timeout: "{{ smtp_timeout }}"
        to: "{{ email_to }}"
        from: "{{ email_from }}"
        subject: "Kubernetes Certificate Expiry Alert"
        body: |-
          The following Kubernetes certificates are nearing expiry
          (threshold: {{ expiry_threshold_days }} days):

          {% for c in alert_list %}
          - {{ c.name }} ({{ c.days_left }} days remaining)
          {% endfor %}

          This alert was generated by AWX.
      when: alert_list | length > 0

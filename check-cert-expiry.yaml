---
- name: Check Kubernetes certificate expiry and send email
  hosts: all
  run_once: true
  become: true
  become_method: sudo
  become_user: root
  gather_facts: false

  vars:
    expiry_threshold_days: 30
    email_to: "gurdyal.sngh@lumen.com"
    email_from: "gurdyal.singh@lumen.com"
    smtp_server: "smtp1.rpod.savvis.net"

  tasks:

    - name: Run kubeadm certs check-expiration
      command: kubeadm certs check-expiration
      register: cert_output
      changed_when: false

    - name: Initialize certificate list
      set_fact:
        expiring_certs: []

    - name: Extract certificate name and remaining days
      set_fact:
        expiring_certs: "{{ expiring_certs + [ {
          'name': fields[0],
          'days_left': (fields[3] | regex_replace('d','') | int)
        } ] }}"
      vars:
        fields: "{{ item.split() }}"
      loop: "{{ cert_output.stdout_lines }}"
      when:
        - item | regex_search('^[a-zA-Z]')
        - item is not search('CERTIFICATE')
        - item.split() | length >= 4

    - name: Filter certificates below expiry threshold
      set_fact:
        alert_list: "{{ expiring_certs | selectattr('days_left', 'lt', expiry_threshold_days) | list }}"

    - name: Send email alert if certificates are expiring
      community.general.mail:
        host: "{{ smtp_server }}"
        to: "{{ email_to }}"
        from: "{{ email_from }}"
        subject: "Kubernetes Certificate Expiry Alert"
        body: |-
          The following Kubernetes certificates are nearing expiry
          (threshold: {{ expiry_threshold_days }} days):

          {% for c in alert_list %}
          - {{ c.name }} ({{ c.days_left }} days remaining)
          {% endfor %}

          Please renew them in advance.
      when: alert_list | length > 0

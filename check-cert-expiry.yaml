---
- name: Check Kubernetes certificate expiry and send email
  hosts: all
  run_once: true
  become: true
  become_method: sudo
  become_user: root
  gather_facts: false

  vars:
    # Alert threshold
    expiry_threshold_days: 30

    # SMTP (matches your working AWX test)
    smtp_server: "mailgate.corp.intranet"
    smtp_port: 25
    smtp_timeout: 10

    email_to: "gurdyal.singh@lumen.com"
    email_from: "no-reply-awx-qa@lumen.com"

  tasks:

    - name: Run kubeadm certs check-expiration
      command: kubeadm certs check-expiration
      register: cert_output
      changed_when: false

    - name: DEBUG | Raw kubeadm output
      debug:
        var: cert_output.stdout_lines

    - name: Initialize certificate lists
      set_fact:
        certs: []
        alert_list: []

    - name: Parse certificate name and remaining days (ROBUST)
      set_fact:
        certs: "{{ certs + [ {
          'name': fields[0],
          'days_left': (days_token | regex_replace('d','') | int)
        } ] }}"
      vars:
        fields: "{{ item.split() }}"
        days_token: "{{ fields | select('match', '^[0-9]+d$') | first }}"
      loop: "{{ cert_output.stdout_lines }}"
      when:
        - item | regex_search('^[a-zA-Z]')
        - item is not search('CERTIFICATE')
        - fields | select('match', '^[0-9]+d$') | list | length > 0

    - name: DEBUG | Parsed certificate list
      debug:
        var: certs

    - name: Filter certificates below expiry threshold
      set_fact:
        alert_list: "{{ certs | selectattr('days_left', 'lt', expiry_threshold_days) | list }}"

    - name: DEBUG | Certificates below {{ expiry_threshold_days }} days
      debug:
        var: alert_list

    - name: Build email subject and body
      set_fact:
        mail_subject: |-
          {% if alert_list | length > 0 %}
          ⚠ Kubernetes Certificate Expiry Alert
          {% else %}
          ✅ Kubernetes Certificate Status – All Healthy
          {% endif %}

        mail_body: |-
          Kubernetes certificate status report
          Threshold: {{ expiry_threshold_days }} days

          {% if alert_list | length > 0 %}
          ⚠ The following certificates are nearing expiry:

          {% for c in alert_list %}
          - {{ c.name }} ({{ c.days_left }} days remaining)
          {% endfor %}

          Please plan renewal.
          {% else %}
          ✅ All Kubernetes certificates are healthy.

          {% for c in certs %}
          - {{ c.name }} ({{ c.days_left }} days remaining)
          {% endfor %}
          {% endif %}

          Generated by AWX.

    - name: DEBUG | Final email subject
      debug:
        var: mail_subject

    - name: Send status email
      community.general.mail:
        host: "{{ smtp_server }}"
        port: "{{ smtp_port }}"
        timeout: "{{ smtp_timeout }}"
        to: "{{ email_to }}"
        from: "{{ email_from }}"
        subject: "{{ mail_subject | trim }}"
        body: "{{ mail_body }}"
